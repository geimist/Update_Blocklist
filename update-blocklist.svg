<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hintergrund Gradient (Synology Navy/Anthrazit) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shield & Server Glossy Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Synology Blue Accent -->
    <linearGradient id="synologyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Danger Accent (Blocklist Red/Orange) -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glowing Filter Matrix -->
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abgerundetes Quadrat als App-Icon Basis -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Subtiles Hintergrund-Netzwerk-Raster -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1.5">
    <path d="M 64,128 H 448 M 64,192 H 448 M 64,256 H 448 M 64,320 H 448 M 64,384 H 448" />
    <path d="M 128,64 V 448 M 192,64 V 448 M 256,64 V 448 M 320,64 V 448 M 384,64 V 448" />
  </g>

  <!-- Zentrales Schutzschild / NAS-Form -->
  <path d="M 256,96 L 384,144 V 272 C 384,352 328,408 256,432 C 184,408 128,352 128,272 V 144 Z" fill="url(#shieldGrad)" stroke="url(#synologyBlue)" stroke-width="6" filter="url(#glow)" />

  <!-- Firewall Grid Muster im Schild -->
  <path d="M 176,170 H 336 M 160,220 H 352 M 150,270 H 362 M 160,320 H 352 M 180,370 H 332" stroke="url(#gridGlow)" stroke-width="3" stroke-dasharray="8 6" />

  <!-- NAS Server-Slots (Subtil im Schild-Zentrum integriert) -->
  <g stroke="url(#synologyBlue)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <!-- Server Drive Bay 1 -->
    <rect x="200" y="200" width="112" height="24" rx="4" fill="#0f172a" />
    <circle cx="216" cy="212" r="3" fill="#38bdf8" />
    <line x1="232" y1="212" x2="296" y2="212" opacity="0.5" />

    <!-- Server Drive Bay 2 -->
    <rect x="200" y="236" width="112" height="24" rx="4" fill="#0f172a" />
    <circle cx="216" cy="248" r="3" fill="#38bdf8" />
    <line x1="232" y1="248" x2="296" y2="248" opacity="0.5" />

    <!-- Server Drive Bay 3 -->
    <rect x="200" y="272" width="112" height="24" rx="4" fill="#0f172a" />
    <circle cx="216" cy="284" r="3" fill="#38bdf8" />
    <line x1="232" y1="284" x2="296" y2="284" opacity="0.5" />
  </g>

  <!-- Blockierte IP-Pakete (Rot/Orange von links & oben drohend) -->
  <g filter="url(#redGlow)">
    <!-- Abgewiesenes Paket 1 -->
    <path d="M 72,160 L 150,210" stroke="url(#dangerGrad)" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" />
    <circle cx="72" cy="160" r="7" fill="#ef4444" />
    <!-- X-Block Marker -->
    <path d="M 144,204 L 156,216 M 156,204 L 144,216" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

    <!-- Abgewiesenes Paket 2 -->
    <path d="M 90,310 L 165,290" stroke="url(#dangerGrad)" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" />
    <circle cx="90" cy="310" r="7" fill="#ef4444" />
    <!-- X-Block Marker -->
    <path d="M 159,284 L 171,296 M 171,284 L 159,296" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Saubere/Gefilterte IP-Daten (Grün/Blau - Sicher im NAS verarbeitet) -->
  <g stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M 256,320 V 375" stroke-dasharray="4 4" />
    <!-- Häkchen für Erfolgreichen Schutz/Synchro -->
    <circle cx="256" cy="375" r="14" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <path d="M 250,375 L 254,379 L 263,370" stroke="#10b981" stroke-width="3" fill="none" />
  </g>
</svg>